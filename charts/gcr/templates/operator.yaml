{{- if .Values.operator.enabled }}
# gcr-operator: evictions of pods that opt in (gcr.dev/migrate-on-evict:
# "true") become migrations to another node; with a registry, StatefulSets'
# pods move through checkpoints there, and pods on nodes that shut down are
# restored from it (docs/operator.md). Needs the runtime (runtime.enabled,
# here or in another release in the same namespace): the gcr-migrate
# runtime class, which only this operator's service account (and cluster
# admins) may run pods on.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gcr-operator
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: gcr-operator
rules:
  # The pods it moves: read them, mark them, create their targets, hand
  # those over to their ReplicaSets and Jobs, mark the sources disrupted
  # (DisruptionTarget) and delete them; and watch for those stopped as
  # their nodes shut down.
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch, create, patch, delete]
  - apiGroups: [""]
    resources: [pods/status]
    verbs: [patch]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  - apiGroups: [apps]
    resources: [replicasets, daemonsets]
    verbs: [get]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get]
  # A StatefulSet's pod: whether its volumes can follow it, and whether a
  # pod its StatefulSet created again is on a node being drained.
  - apiGroups: [""]
    resources: [persistentvolumeclaims, persistentvolumes, nodes]
    verbs: [get]
  # Its own certificate's CA, in its webhooks' configurations.
  - apiGroups: [admissionregistration.k8s.io]
    resources: [validatingwebhookconfigurations, mutatingwebhookconfigurations]
    resourceNames: [gcr-operator]
    verbs: [get, update]
  # Whether the gcr-migrate policy lets StatefulSets' pods restore.
  - apiGroups: [admissionregistration.k8s.io]
    resources: [validatingadmissionpolicies]
    resourceNames: [gcr-migrate]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: gcr-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: gcr-operator
subjects:
  - kind: ServiceAccount
    name: gcr-operator
    namespace: {{ .Release.Namespace }}
---
# The migrations' Jobs, the Secrets that hand them tokens, and the pending
# restores of StatefulSets' pods, in gcr's namespace only.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gcr-operator
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, create, delete]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create, delete]
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [create]
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [gcr-restores]
    verbs: [get, patch, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gcr-operator
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: gcr-operator
subjects:
  - kind: ServiceAccount
    name: gcr-operator
    namespace: {{ .Release.Namespace }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gcr-operator
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: gcr-operator}
  template:
    metadata:
      labels: {app.kubernetes.io/name: gcr-operator}
    spec:
      serviceAccountName: gcr-operator
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.operator.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.operator.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.operator.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # Evicted with the pods it moves, it finishes moving them first.
      terminationGracePeriodSeconds: 120
      containers:
        - name: operator
          image: {{ include "gcr.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: [/gcr-operator]
          {{- $args := .Values.operator.extraArgs }}
          {{- if .Values.operator.registry }}
          {{- $args = concat (list "-registry" .Values.operator.registry) $args }}
          {{- end }}
          {{- if .Values.operator.plainHTTP }}
          {{- $args = append $args "-plain-http" }}
          {{- end }}
          {{- if $args }}
          args:
            {{- toYaml $args | nindent 12 }}
          {{- else }}
          # StatefulSets' pods move through checkpoints in a registry the
          # nodes reach (without, they are evicted), operator.registry:
          # args: [-registry, registry.example.com/gcr/checkpoints]
          {{- end }}
          env:
            - name: POD_NAMESPACE
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
            # Its own evictions wait for the migrations it runs, and for
            # the pods to move off its node first.
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - name: NODE_NAME
              valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
          ports:
            - containerPort: 8443
          readinessProbe:
            httpGet: {path: /healthz, port: 8443, scheme: HTTPS}
          {{- with .Values.operator.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            capabilities: {drop: [ALL]}
---
apiVersion: v1
kind: Service
metadata:
  name: gcr-operator
  namespace: {{ .Release.Namespace }}
spec:
  selector: {app.kubernetes.io/name: gcr-operator}
  ports:
    - port: 443
      targetPort: 8443
---
# The operator puts its CA into clientConfig.caBundle when it starts.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: gcr-operator
webhooks:
  - name: evictions.gcr.dev
    admissionReviewVersions: [v1]
    sideEffects: NoneOnDryRun
    # If the operator is down, evictions go through as they would
    # without gcr.
    failurePolicy: Ignore
    timeoutSeconds: 10
    clientConfig:
      service:
        name: gcr-operator
        namespace: {{ .Release.Namespace }}
        path: /evict
    rules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE]
        resources: [pods/eviction]
---
# Steers a pod a StatefulSet, a ReplicaSet or a Job creates in place of one
# the operator checkpointed to restore from the checkpoint. The operator puts its CA
# into clientConfig.caBundle when it starts.
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: gcr-operator
webhooks:
  - name: restores.gcr.dev
    admissionReviewVersions: [v1]
    sideEffects: None
    # If the operator is down, the pod starts cold, as without gcr.
    failurePolicy: Ignore
    timeoutSeconds: 5
    clientConfig:
      service:
        name: gcr-operator
        namespace: {{ .Release.Namespace }}
        path: /restore
    rules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE]
        resources: [pods]
    # Only their pods that opt in.
    matchConditions:
      - name: controlled-opted-in
        expression: >-
          has(object.metadata.annotations) &&
          'gcr.dev/migrate-on-evict' in object.metadata.annotations &&
          object.metadata.annotations['gcr.dev/migrate-on-evict'] == 'true' &&
          has(object.metadata.ownerReferences) &&
          object.metadata.ownerReferences.exists(r, r.kind in ['StatefulSet', 'ReplicaSet', 'Job'])
{{- end }}
