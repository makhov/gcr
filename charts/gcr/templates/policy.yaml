{{- if .Values.runtime.enabled }}
# Only cluster admins and gcr's operator may run pods on gcr-migrate; and
# the StatefulSet, ReplicaSet and Job controllers, a pod they create to
# restore from the checkpoint of the one it replaces: with the token of its
# pending restore, which gcr's operator records in the ConfigMap
# gcr-restores (NAMESPACE.NAME for a StatefulSet's pod, NAMESPACE.TOKEN for
# the others, whose names are new), and steers the pod to restore from
# (docs/design/gcr-operator.md).
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: gcr-migrate
spec:
  failurePolicy: Fail
  paramKind:
    apiVersion: v1
    kind: ConfigMap
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
  matchConditions:
    - name: on-gcr-migrate
      expression: has(object.spec.runtimeClassName) && object.spec.runtimeClassName == 'gcr-migrate'
  variables:
    - name: annotations
      expression: 'has(object.metadata.annotations) ? object.metadata.annotations : {}'
    - name: token
      expression: "'gcr.dev/restore-token' in variables.annotations ? variables.annotations['gcr.dev/restore-token'] : ''"
    # The pending restore's keys: by the pod's name, and by its token.
    - name: restores
      expression: "[request.namespace + '.' + object.metadata.name, request.namespace + '.' + variables.token]"
  validations:
    - expression: >-
        'system:masters' in request.userInfo.groups ||
        request.userInfo.username == '{{ include "gcr.operatorUser" . }}' ||
        (request.userInfo.username in ['system:serviceaccount:kube-system:statefulset-controller',
        'system:serviceaccount:kube-system:replicaset-controller', 'system:serviceaccount:kube-system:job-controller',
        'system:kube-controller-manager'] &&
        !('gcr.dev/migrate-in' in variables.annotations) &&
        variables.token != '' && 'gcr.dev/fork-from' in variables.annotations &&
        params != null && has(params.data) &&
        variables.restores.exists(k, k in params.data && params.data[k].startsWith('{"token":"' + variables.token +
        '","dir":"' + variables.annotations['gcr.dev/fork-from'] + '",')))
      message: >-
        only cluster admins and gcr's operator may run pods on runtime class
        gcr-migrate (and StatefulSets, ReplicaSets and Jobs, to restore a pod
        gcr's operator moves):
        its pods make a node's shim listen for a migration, or restore from
        a checkpoint on the node
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: gcr-migrate
spec:
  policyName: gcr-migrate
  paramRef:
    name: gcr-restores
    namespace: {{ .Release.Namespace }}
    # This chart makes it: were it missing, no pod could run on
    # gcr-migrate, rather than any.
    parameterNotFoundAction: Deny
  validationActions: [Deny]
---
# The pending restores of StatefulSets' pods gcr's operator moves:
# NAMESPACE.NAME to the restore, which it writes, and the gcr-migrate
# policy reads.
apiVersion: v1
kind: ConfigMap
metadata:
  name: gcr-restores
  namespace: {{ .Release.Namespace }}
{{- end }}
