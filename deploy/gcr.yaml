# gcr on every node of a Kubernetes cluster that runs containerd:
#
#   kubectl apply -f gcr.yaml
#
# A DaemonSet runs `gcr setup` on each node: it installs the shim and gcr's
# CRIU, registers the runtime with containerd, and labels the node
# gcr.dev/runtime=ready. Pods with runtimeClassName: gcr run there. The
# chart (helm install gcr charts/gcr) does the same, with options.
#
# Generated from charts/gcr by `make manifests`: change the chart.
---
apiVersion: v1
kind: Namespace
metadata:
  name: gcr-system
---
# A DaemonSet runs `gcr setup` on each node (deploy/install.sh): it installs
# the shim and gcr's CRIU, registers the runtime with containerd and
# restarts it (running pods carry on), and labels the node
# gcr.dev/runtime=ready. Pods with runtimeClassName: gcr run there. A node
# that lacks something gcr needs keeps its pod crash-looping, with gcr
# doctor's report in its logs. Deleting it leaves gcr installed on the
# nodes, but unlabels them.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gcr-installer
  namespace: gcr-system
---
# The pending restores of StatefulSets' pods gcr's operator moves:
# NAMESPACE.NAME to the restore, which it writes, and the gcr-migrate
# policy reads.
apiVersion: v1
kind: ConfigMap
metadata:
  name: gcr-restores
  namespace: gcr-system
---
# To label its own node.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: gcr-installer
rules:
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: gcr-installer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: gcr-installer
subjects:
  - kind: ServiceAccount
    name: gcr-installer
    namespace: gcr-system
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: gcr-installer
  namespace: gcr-system
spec:
  selector:
    matchLabels: {app: gcr-installer}
  updateStrategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 1}
  template:
    metadata:
      labels: {app: gcr-installer}
    spec:
      serviceAccountName: gcr-installer
      # It installs onto the host and restarts containerd: host PID 1's
      # namespaces, and the host's files.
      hostPID: true
      priorityClassName: system-node-critical
      tolerations:
        - operator: Exists
      containers:
        - name: install
          image: ghcr.io/makhov/gcr:v0.1.6
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: true
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef: {fieldPath: spec.nodeName}
            # Passed on to gcr setup: -containerd-config and
            # -containerd-unit for distributions that run containerd their
            # own way (k3s, RKE2), -docker, -no-restart.
            - name: GCR_SETUP_ARGS
              value: ""
          volumeMounts:
            - {name: host, mountPath: /host}
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
      volumes:
        - name: host
          hostPath: {path: /}
---
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: gcr
handler: gcr
scheduling:
  # Only on nodes where gcr is installed and ready.
  nodeSelector:
    gcr.dev/runtime: ready
---
# The targets of migrations between nodes (kubectl gcr migrate): the same
# runtime, on a handler whose pods may make the node's shim listen for a
# migration and restore what it receives (gcr.dev/migrate-in).
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: gcr-migrate
handler: gcr-migrate
scheduling:
  nodeSelector:
    gcr.dev/runtime: ready
---
# Only cluster admins and gcr's operator may run pods on gcr-migrate; and
# the StatefulSet, ReplicaSet and Job controllers, a pod they create to
# restore from the checkpoint of the one it replaces: with the token of its
# pending restore, which gcr's operator records in the ConfigMap
# gcr-restores (NAMESPACE.NAME for a StatefulSet's pod, NAMESPACE.TOKEN for
# the others, whose names are new), and steers the pod to restore from
# (docs/design/gcr-operator.md).
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: gcr-migrate
spec:
  failurePolicy: Fail
  paramKind:
    apiVersion: v1
    kind: ConfigMap
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
  matchConditions:
    - name: on-gcr-migrate
      expression: has(object.spec.runtimeClassName) && object.spec.runtimeClassName == 'gcr-migrate'
  variables:
    - name: annotations
      expression: 'has(object.metadata.annotations) ? object.metadata.annotations : {}'
    - name: token
      expression: "'gcr.dev/restore-token' in variables.annotations ? variables.annotations['gcr.dev/restore-token'] : ''"
    # The pending restore's keys: by the pod's name, and by its token.
    - name: restores
      expression: "[request.namespace + '.' + object.metadata.name, request.namespace + '.' + variables.token]"
  validations:
    - expression: >-
        'system:masters' in request.userInfo.groups ||
        request.userInfo.username == 'system:serviceaccount:gcr-system:gcr-operator' ||
        (request.userInfo.username in ['system:serviceaccount:kube-system:statefulset-controller',
        'system:serviceaccount:kube-system:replicaset-controller', 'system:serviceaccount:kube-system:job-controller',
        'system:kube-controller-manager'] &&
        !('gcr.dev/migrate-in' in variables.annotations) &&
        variables.token != '' && 'gcr.dev/fork-from' in variables.annotations &&
        params != null && has(params.data) &&
        variables.restores.exists(k, k in params.data && params.data[k].startsWith('{"token":"' + variables.token +
        '","dir":"' + variables.annotations['gcr.dev/fork-from'] + '",')))
      message: >-
        only cluster admins and gcr's operator may run pods on runtime class
        gcr-migrate (and StatefulSets, ReplicaSets and Jobs, to restore a pod
        gcr's operator moves):
        its pods make a node's shim listen for a migration, or restore from
        a checkpoint on the node
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: gcr-migrate
spec:
  policyName: gcr-migrate
  paramRef:
    name: gcr-restores
    namespace: gcr-system
    # This chart makes it: were it missing, no pod could run on
    # gcr-migrate, rather than any.
    parameterNotFoundAction: Deny
  validationActions: [Deny]
