# gcr on every node of a Kubernetes cluster that runs containerd:
#
#   kubectl apply -f gcr.yaml
#
# A DaemonSet runs `gcr setup` on each node (install.sh): it installs the
# shim and gcr's CRIU, registers the runtime with containerd and restarts
# it (running pods carry on), and labels the node gcr.dev/runtime=ready.
# Pods with runtimeClassName: gcr run there. A node that lacks something
# gcr needs keeps its pod crash-looping, with gcr doctor's report in its
# logs. Deleting this leaves gcr installed on the nodes, but unlabels them.
apiVersion: v1
kind: Namespace
metadata:
  name: gcr-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gcr-installer
  namespace: gcr-system
---
# To label its own node.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: gcr-installer
rules:
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: gcr-installer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: gcr-installer
subjects:
  - kind: ServiceAccount
    name: gcr-installer
    namespace: gcr-system
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: gcr-installer
  namespace: gcr-system
spec:
  selector:
    matchLabels: {app: gcr-installer}
  updateStrategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 1}
  template:
    metadata:
      labels: {app: gcr-installer}
    spec:
      serviceAccountName: gcr-installer
      # It installs onto the host and restarts containerd: host PID 1's
      # namespaces, and the host's files.
      hostPID: true
      priorityClassName: system-node-critical
      tolerations:
        - operator: Exists
      containers:
        - name: install
          image: ghcr.io/makhov/gcr:v0.1.0
          securityContext:
            privileged: true
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef: {fieldPath: spec.nodeName}
            # Passed on to gcr setup: -containerd-config and
            # -containerd-unit for distributions that run containerd their
            # own way (k3s, RKE2), -docker, -no-restart.
            - name: GCR_SETUP_ARGS
              value: ""
          volumeMounts:
            - {name: host, mountPath: /host}
          resources:
            requests: {cpu: 10m, memory: 16Mi}
      volumes:
        - name: host
          hostPath: {path: /}
---
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: gcr
handler: gcr
scheduling:
  # Only on nodes where gcr is installed and ready.
  nodeSelector:
    gcr.dev/runtime: ready
---
# The targets of migrations between nodes (kubectl gcr migrate): the same
# runtime, on a handler whose pods may make the node's shim listen for a
# migration and restore what it receives (gcr.dev/migrate-in).
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: gcr-migrate
handler: gcr-migrate
scheduling:
  nodeSelector:
    gcr.dev/runtime: ready
---
# Only cluster admins and gcr's operator may run pods on gcr-migrate.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: gcr-migrate
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
  matchConditions:
    - name: on-gcr-migrate
      expression: has(object.spec.runtimeClassName) && object.spec.runtimeClassName == 'gcr-migrate'
  validations:
    - expression: >-
        'system:masters' in request.userInfo.groups ||
        request.userInfo.username == 'system:serviceaccount:gcr-system:gcr-operator'
      message: >-
        only cluster admins and gcr's operator may run pods on runtime class
        gcr-migrate: its pods make a node's shim listen for a migration
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: gcr-migrate
spec:
  policyName: gcr-migrate
  validationActions: [Deny]
