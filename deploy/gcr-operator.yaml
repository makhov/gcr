# gcr-operator: evictions of pods that opt in (gcr.dev/migrate-on-evict:
# "true") become migrations to another node (docs/design/gcr-operator.md).
# Needs gcr.yaml applied first: its DaemonSet, and the gcr-migrate runtime
# class, which only this operator's service account (and cluster admins)
# may run pods on.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gcr-operator
  namespace: gcr-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: gcr-operator
rules:
  # The pods it moves: read them, mark them, create their targets, hand
  # those over to their ReplicaSets and delete the sources.
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, create, patch, delete]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  - apiGroups: [apps]
    resources: [replicasets, daemonsets]
    verbs: [get]
  # Its own certificate's CA, in its webhook's configuration.
  - apiGroups: [admissionregistration.k8s.io]
    resources: [validatingwebhookconfigurations]
    resourceNames: [gcr-operator]
    verbs: [get, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: gcr-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: gcr-operator
subjects:
  - kind: ServiceAccount
    name: gcr-operator
    namespace: gcr-system
---
# The migrations' Jobs, and the Secrets that hand them tokens, in gcr's
# namespace only.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gcr-operator
  namespace: gcr-system
rules:
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, create, delete]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gcr-operator
  namespace: gcr-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: gcr-operator
subjects:
  - kind: ServiceAccount
    name: gcr-operator
    namespace: gcr-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gcr-operator
  namespace: gcr-system
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: gcr-operator}
  template:
    metadata:
      labels: {app.kubernetes.io/name: gcr-operator}
    spec:
      serviceAccountName: gcr-operator
      containers:
        - name: operator
          image: ghcr.io/makhov/gcr:v0.1.0
          command: [/gcr-operator]
          env:
            - name: POD_NAMESPACE
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
            # Its own evictions wait for the migrations it runs.
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
          ports:
            - containerPort: 8443
          readinessProbe:
            httpGet: {path: /healthz, port: 8443, scheme: HTTPS}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            capabilities: {drop: [ALL]}
---
apiVersion: v1
kind: Service
metadata:
  name: gcr-operator
  namespace: gcr-system
spec:
  selector: {app.kubernetes.io/name: gcr-operator}
  ports:
    - port: 443
      targetPort: 8443
---
# The operator puts its CA into clientConfig.caBundle when it starts.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: gcr-operator
webhooks:
  - name: evictions.gcr.dev
    admissionReviewVersions: [v1]
    sideEffects: NoneOnDryRun
    # If the operator is down, evictions go through as they would
    # without gcr.
    failurePolicy: Ignore
    timeoutSeconds: 10
    clientConfig:
      service:
        name: gcr-operator
        namespace: gcr-system
        path: /evict
    rules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE]
        resources: [pods/eviction]
