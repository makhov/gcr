# gcr-operator: evictions of pods that opt in (gcr.dev/migrate-on-evict:
# "true") become migrations to another node (docs/operator.md). Needs
# gcr.yaml applied first.
#
#   kubectl apply -f gcr-operator.yaml
#
# Generated from charts/gcr by `make manifests`: change the chart.
---
# gcr-operator: carries out gcr.dev's operations on pods (operations.yaml);
# evictions of pods that opt in (gcr.dev/migrate-on-evict:
# "true") become migrations to another node; with a registry, StatefulSets'
# pods move through checkpoints there, and pods on nodes that shut down are
# restored from it (docs/operator.md). Needs the runtime (runtime.enabled,
# here or in another release in the same namespace): the gcr-migrate
# runtime class, which only this operator's service account (and cluster
# admins) may run pods on.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gcr-operator
  namespace: gcr-system
---
# gcr's operations on running pods (gcr.dev/v1alpha1, docs/operations.md):
# each is carried out once by gcr-operator, which reports in its status.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: snapshots.gcr.dev
spec:
  group: gcr.dev
  scope: Namespaced
  names:
    kind: Snapshot
    plural: snapshots
    singular: snapshot
    listKind: SnapshotList
    categories:
      - gcr
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Pod
          type: string
          jsonPath: .spec.pod
        - name: Image
          type: string
          jsonPath: .status.image
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          description: "Pushes a running pod's container to a registry as an image that pods run, restoring its processes. The pod keeps running."
          required:
            - spec
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required:
                - pod
              properties:
                pod:
                  type: string
                  description: "The pod, in this namespace."
                  minLength: 1
                container:
                  type: string
                  description: "The pod's container; may be left out in a pod with one."
                image:
                  type: string
                  description: "The image reference to push to. Without it, the image goes to this Snapshot's registry, or else to the one gcr-operator keeps snapshots in (-snapshot-registry), as NAMESPACE/POD tagged with this Snapshot's name. status.image is what was pushed, by digest, either way."
                  minLength: 1
                registry:
                  type: string
                  description: "The repository (host[:port]/path) to put the image in when no image is given, instead of gcr-operator's own."
                  minLength: 1
                pushSecret:
                  type: string
                  description: "A kubernetes.io/dockerconfigjson Secret in this namespace with credentials for the image's registry. Without, the node's own are used."
                plainHTTP:
                  type: boolean
                  description: Talk to the registry without TLS.
              x-kubernetes-validations:
                - rule: "self == oldSelf"
                  message: "an operation's spec cannot change: create another"
            status:
              type: object
              properties:
                phase:
                  type: string
                  description: "Running from when gcr-operator picks it up, then Succeeded or Failed."
                  enum:
                    - Running
                    - Succeeded
                    - Failed
                node:
                  type: string
                  description: "The pod's node when it started."
                message:
                  type: string
                  description: Why it failed.
                startTime:
                  type: string
                  format: date-time
                completionTime:
                  type: string
                  format: date-time
                image:
                  type: string
                  description: "The image pushed, by digest."
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: migrations.gcr.dev
spec:
  group: gcr.dev
  scope: Namespaced
  names:
    kind: Migration
    plural: migrations
    singular: migration
    listKind: MigrationList
    categories:
      - gcr
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Pod
          type: string
          jsonPath: .spec.pod
        - name: From
          type: string
          jsonPath: .status.node
        - name: To
          type: string
          jsonPath: .status.targetNode
        - name: Downtime
          type: string
          jsonPath: .status.downtime
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          description: "Moves a running pod to another node, its processes carrying on there."
          required:
            - spec
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required:
                - pod
              properties:
                pod:
                  type: string
                  description: "The pod, in this namespace."
                  minLength: 1
                node:
                  type: string
                  description: "The node to move it to. Without, the scheduler picks one other than its own."
                throughRegistry:
                  type: boolean
                  description: "Move it through a checkpoint in gcr-operator's registry rather than node to node. A StatefulSet's pod always moves this way."
              x-kubernetes-validations:
                - rule: "self == oldSelf"
                  message: "an operation's spec cannot change: create another"
            status:
              type: object
              properties:
                phase:
                  type: string
                  description: "Running from when gcr-operator picks it up, then Succeeded or Failed."
                  enum:
                    - Running
                    - Succeeded
                    - Failed
                node:
                  type: string
                  description: "The pod's node when it started."
                message:
                  type: string
                  description: Why it failed.
                startTime:
                  type: string
                  format: date-time
                completionTime:
                  type: string
                  format: date-time
                targetNode:
                  type: string
                  description: Where it moved to.
                target:
                  type: string
                  description: The pod that runs it there.
                downtime:
                  type: string
                  description: How long its processes were stopped.
---
