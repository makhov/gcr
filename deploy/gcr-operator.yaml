---
# Who may carry out operations on the pods in a namespace: bind it there
# (RoleBinding). A Snapshot without a pushSecret pushes with the nodes'
# credentials, to whatever image it names; a Migration or a Rewind
# replaces a pod's processes.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: gcr-operations
rules:
  - apiGroups: [gcr.dev]
    resources: [snapshots, migrations, timepoints, rewinds]
    verbs: [get, list, watch, create, delete]
---
# Reading them, for those who may read a namespace (view, edit, admin).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: gcr-operations-view
  labels:
    rbac.authorization.k8s.io/aggregate-to-view: "true"
    rbac.authorization.k8s.io/aggregate-to-edit: "true"
    rbac.authorization.k8s.io/aggregate-to-admin: "true"
rules:
  - apiGroups: [gcr.dev]
    resources: [snapshots, migrations, timepoints, rewinds]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: gcr-operator
rules:
  # The pods it moves: read them, mark them, create their targets, hand
  # those over to their ReplicaSets and Jobs, mark the sources disrupted
  # (DisruptionTarget) and delete them; and watch for those stopped as
  # their nodes shut down.
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch, create, patch, delete]
  - apiGroups: [""]
    resources: [pods/status]
    verbs: [patch]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  - apiGroups: [apps]
    resources: [replicasets, daemonsets]
    verbs: [get]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get]
  # A StatefulSet's pod: whether its volumes can follow it, and whether a
  # pod its StatefulSet created again is on a node being drained; and
  # nodes starting to shut down, whose pods it moves.
  - apiGroups: [""]
    resources: [persistentvolumeclaims, persistentvolumes]
    verbs: [get]
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, list, watch]
  # gcr.dev's operations, which it carries out and reports on; and the
  # push Secrets Snapshots name.
  - apiGroups: [gcr.dev]
    resources: [snapshots, migrations, timepoints, rewinds]
    verbs: [get, list, watch]
  - apiGroups: [gcr.dev]
    resources: [snapshots/status, migrations/status, timepoints/status, rewinds/status]
    verbs: [update]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get]
  # Its own certificate's CA, in its webhooks' configurations.
  - apiGroups: [admissionregistration.k8s.io]
    resources: [validatingwebhookconfigurations, mutatingwebhookconfigurations]
    resourceNames: [gcr-operator]
    verbs: [get, update]
  # Whether the gcr-migrate policy lets StatefulSets' pods restore.
  - apiGroups: [admissionregistration.k8s.io]
    resources: [validatingadmissionpolicies]
    resourceNames: [gcr-migrate]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: gcr-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: gcr-operator
subjects:
  - kind: ServiceAccount
    name: gcr-operator
    namespace: gcr-system
---
# The migrations' Jobs, the Secrets that hand them tokens, and the pending
# restores of StatefulSets' pods, in gcr's namespace only.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gcr-operator
  namespace: gcr-system
rules:
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, create, delete]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create, delete]
  # Commands on a node shutting down, which admits no Job, in gcr's
  # installer pod there: over WebSocket (get), or SPDY (create).
  - apiGroups: [""]
    resources: [pods/exec]
    verbs: [get, create]
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [create]
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [gcr-restores]
    verbs: [get, patch, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gcr-operator
  namespace: gcr-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: gcr-operator
subjects:
  - kind: ServiceAccount
    name: gcr-operator
    namespace: gcr-system
---
apiVersion: v1
kind: Service
metadata:
  name: gcr-operator
  namespace: gcr-system
spec:
  selector: {app.kubernetes.io/name: gcr-operator}
  ports:
    - port: 443
      targetPort: 8443
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gcr-operator
  namespace: gcr-system
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: gcr-operator}
  template:
    metadata:
      labels: {app.kubernetes.io/name: gcr-operator}
    spec:
      serviceAccountName: gcr-operator
      # Evicted with the pods it moves, it finishes moving them first.
      terminationGracePeriodSeconds: 120
      containers:
        - name: operator
          image: ghcr.io/makhov/gcr:v0.1.6
          imagePullPolicy: IfNotPresent
          command: [/gcr-operator]
          # StatefulSets' pods move through checkpoints in a registry the
          # nodes reach (without, they are evicted), operator.registry;
          # Snapshots that name no image go to operator.snapshotRegistry:
          # args: [-registry, registry.example.com/gcr/checkpoints,
          #        -snapshot-registry, registry.example.com/snapshots]
          env:
            - name: POD_NAMESPACE
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
            # Its own evictions wait for the migrations it runs, and for
            # the pods to move off its node first.
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - name: NODE_NAME
              valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
          ports:
            - containerPort: 8443
          readinessProbe:
            httpGet: {path: /healthz, port: 8443, scheme: HTTPS}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            capabilities: {drop: [ALL]}
---
# Steers a pod a StatefulSet, a ReplicaSet or a Job creates in place of one
# the operator checkpointed to restore from the checkpoint. The operator puts its CA
# into clientConfig.caBundle when it starts.
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: gcr-operator
webhooks:
  - name: restores.gcr.dev
    admissionReviewVersions: [v1]
    sideEffects: None
    # If the operator is down, the pod starts cold, as without gcr. It
    # may wait 2 s for its informer to see the pod a new one replaces.
    failurePolicy: Ignore
    timeoutSeconds: 15
    clientConfig:
      service:
        name: gcr-operator
        namespace: gcr-system
        path: /restore
    rules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE]
        resources: [pods]
    # Only their pods that opt in.
    matchConditions:
      - name: controlled-opted-in
        expression: >-
          has(object.metadata.annotations) &&
          'gcr.dev/migrate-on-evict' in object.metadata.annotations &&
          object.metadata.annotations['gcr.dev/migrate-on-evict'] == 'true' &&
          has(object.metadata.ownerReferences) &&
          object.metadata.ownerReferences.exists(r, r.kind in ['StatefulSet', 'ReplicaSet', 'Job'])
---
# The operator puts its CA into clientConfig.caBundle when it starts.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: gcr-operator
webhooks:
  - name: evictions.gcr.dev
    admissionReviewVersions: [v1]
    sideEffects: NoneOnDryRun
    # If the operator is down, evictions go through as they would
    # without gcr.
    failurePolicy: Ignore
    timeoutSeconds: 10
    clientConfig:
      service:
        name: gcr-operator
        namespace: gcr-system
        path: /evict
    rules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE]
        resources: [pods/eviction]
