<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Doom on the move</title>
<style>
  :root { --bg: #0b0b0c; --panel: #17171a; --text: #e8e6e3; --dim: #8b8a88; --hot: #e5482f; --ok: #6cc36c; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 14px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; }
  body { display: grid; grid-template-rows: auto 1fr; }
  header { display: flex; flex-wrap: wrap; gap: 8px 24px; align-items: baseline; padding: 10px 16px;
    background: var(--panel); border-bottom: 1px solid #26262b; }
  h1 { margin: 0; font-size: 16px; color: var(--hot); letter-spacing: .04em; }
  .stat b { color: var(--text); font-weight: 600; }
  .stat { color: var(--dim); }
  #moving { color: var(--hot); visibility: hidden; }
  body.moving #moving { visibility: visible; }
  main { position: relative; min-height: 0; }
  #game, #game > div { position: absolute; inset: 0; }
  #still { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain;
    filter: grayscale(.7) brightness(.55); visibility: hidden; }
  body:not(.live) #still.shown { visibility: visible; }
  #wait { position: absolute; inset: 0; display: grid; place-items: center; color: var(--dim);
    pointer-events: none; }
  body.live #wait { display: none; }
  #flash { position: absolute; inset: 0; pointer-events: none; border: 4px solid var(--hot); opacity: 0;
    transition: opacity .6s; }
  #flash.on { opacity: 1; transition: none; }
  #log { position: absolute; right: 12px; bottom: 12px; max-width: min(420px, calc(100% - 24px));
    background: rgba(23, 23, 26, .85); padding: 8px 10px; border-radius: 6px; color: var(--dim);
    pointer-events: none; font-size: 12px; }
  #log div b { color: var(--ok); font-weight: 600; }
  #log div.fail b { color: var(--hot); }
</style>
</head>
<body>
<header>
  <h1>DOOM, ON THE MOVE</h1>
  <span class="stat">node <b id="node">…</b></span>
  <span class="stat">moves <b id="moves">0</b></span>
  <span class="stat">last pause <b id="pause">–</b></span>
  <span class="stat" id="modestat">moving <b id="mode">–</b></span>
  <span class="stat">next move in <b id="next">–</b></span>
  <span id="moving">moving…</span>
</header>
<main>
  <div id="game"></div>
  <canvas id="still"></canvas>
  <div id="wait">connecting…</div>
  <div id="flash"></div>
  <div id="log"></div>
</main>
<script>
  const $ = (id) => document.getElementById(id);
  let moves = 0;
  async function poll() {
    try {
      const s = await (await fetch("status.json", { cache: "no-store" })).json();
      $("node").textContent = s.node || "…";
      $("moves").textContent = s.moves;
      $("next").textContent = s.moving ? "now" : `${s.next ?? "–"} s`;
      $("pause").textContent = s.last && s.last.ok ? s.last.downtime : "–";
      $("mode").textContent = { PostCopy: "post-copy", PreCopy: "pre-copy" }[s.mode] || "–";
      $("modestat").title = s.fallback ? `post-copy was refused, so it moves pre-copy: ${s.fallback}` : "";
      document.body.classList.toggle("moving", !!s.moving);
      if (s.moves !== moves) {
        moves = s.moves;
        $("flash").classList.add("on");
        setTimeout(() => $("flash").classList.remove("on"), 50);
      }
      $("log").replaceChildren(...(s.history || []).slice(0, 5).map((h) => {
        const d = document.createElement("div");
        if (!h.ok) d.className = "fail";
        d.innerHTML = h.ok ? `${h.from} → ${h.to}, paused <b>${h.downtime}</b>` : `<b>failed</b>: ${h.message}`;
        return d;
      }));
    } catch (e) { /* the page outlives the arcade restarting */ }
  }
  setInterval(poll, 500);
  poll();
</script>
<script type="module">
  // noVNC's client, without its UI: that gives up when a reconnect fails,
  // as it does during a move, until the game is restored in its new pod.
  // This client tries again until the game answers, and drops an attempt
  // that hasn't connected in 2 seconds (one sent to a pod that's gone
  // hangs). Each attempt draws in an element of its own, removed when it's
  // dropped: noVNC takes a few seconds more to close it.
  import RFB from "./core/rfb.js";
  import { getKeycode, getKeysym } from "./core/input/util.js";
  const url = `${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/websockify?token=doom`;
  // The game's X server moves with the keys it has down. Keys held as the
  // connection drops stay down in it, unless the page tells it otherwise
  // when it's back: it releases those since let go, and presses those
  // since held. It releases those still held when they're let go of too:
  // noVNC drops the release of a key it didn't see pressed.
  const held = new Map();
  let stale = new Map(), carried = new Map();
  addEventListener("keydown", (e) => { held.set(getKeycode(e), getKeysym(e)); }, true);
  addEventListener("keyup", (e) => {
    const code = getKeycode(e);
    held.delete(code);
    if (carried.has(code)) rfb.sendKey(carried.get(code), code, false);
    carried.delete(code);
  }, true);
  addEventListener("blur", () => {
    for (const [code, sym] of carried) rfb.sendKey(sym, code, false);
    held.clear();
    carried.clear();
  });
  let rfb, clicked = false;
  function connect() {
    const screen = document.getElementById("game").appendChild(document.createElement("div"));
    const r = rfb = new RFB(screen, url);
    r.scaleViewport = true;
    r.background = "#0b0b0c";
    let over = false, live = false;
    const retry = () => {
      if (over) return;
      over = true;
      clearTimeout(stuck);
      if (live) stale = new Map(held);
      screen.remove();
      document.body.classList.remove("live");
      setTimeout(connect, 100);
    };
    const stuck = setTimeout(() => { r.disconnect(); retry(); }, 2000);
    r.addEventListener("connect", () => {
      clearTimeout(stuck);
      live = true;
      for (const [code, sym] of stale) if (!held.has(code)) r.sendKey(sym, code, false);
      for (const [code, sym] of held) if (!stale.has(code)) r.sendKey(sym, code, true);
      stale = new Map();
      carried = new Map(held);
      if (clicked) r.focus();
      // The still frame stays until the game's first frame is drawn.
      const d = r._display, flip = d.flip;
      d.flip = function (...a) {
        d.flip = flip;
        flip.apply(this, a);
        if (!over) document.body.classList.add("live");
      };
    });
    r.addEventListener("disconnect", retry);
  }
  connect();
  // A copy of the picture, shown dimmed while the game is away: noVNC
  // clears its own as the connection drops.
  const still = document.getElementById("still");
  setInterval(() => {
    const c = document.querySelector("#game canvas");
    if (!document.body.classList.contains("live") || !c || !c.width) return;
    still.width = c.width;
    still.height = c.height;
    still.getContext("2d").drawImage(c, 0, 0);
    still.classList.add("shown");
  }, 200);
  // Keys go to the game, wherever the page was clicked.
  addEventListener("click", () => { clicked = true; rfb.focus(); });
</script>
</body>
</html>
