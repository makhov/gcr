# A k0da cluster: a controller and two workers, all of which run pods. The
# controller's port 30090, where the arcade's Service listens on every node
# (doom.yaml), is published on the host's 8090: http://localhost:8090.
apiVersion: k0da.k0sproject.io/v1alpha1
kind: Cluster
spec:
  k0s:
    version: v1.37.1-k0s.0
  nodes:
    - role: controller
      ports:
        - containerPort: 30090
          hostPort: 8090
    - role: worker
    - role: worker
