# The documentation site (mkdocs.yml): built on pull requests that touch
# it, and built and published to GitHub Pages from main and when a release
# is published. The version the pages show comes from the release tag
# (hack/mkdocs_macros.py), so publishing a release refreshes them.
name: Docs

on:
  push:
    branches: [main]
    paths: [docs/**, mkdocs.yml, hack/mkdocs_macros.py, .github/workflows/docs.yml]
  pull_request:
    paths: [docs/**, mkdocs.yml, hack/mkdocs_macros.py, .github/workflows/docs.yml]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The tags: the version the pages show, when the run is not a
          # release's own.
          fetch-depth: 0
      - name: The release the pages name
        if: github.event_name == 'release'
        run: echo "GCR_VERSION=${{ github.event.release.tag_name }}" >>"$GITHUB_ENV"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - run: pip install -r docs/requirements.txt
      # A page that names this release instead of {{{ gcr_version }}}
      # would go stale with the next one.
      - run: hack/docs-no-version.sh
      # Strict: a broken link, a page missing from the nav, or an unknown
      # variable fails it.
      - run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
