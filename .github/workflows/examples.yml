name: Example images

# The images examples/doom runs, for amd64 and arm64, pushed to ghcr.io when
# they change on main.
on:
  push:
    branches: [main]
    paths: [examples/doom/doom/**, examples/doom/arcade/**, .github/workflows/examples.yml]
  pull_request:
    paths: [examples/doom/doom/**, examples/doom/arcade/**, .github/workflows/examples.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    name: ${{ matrix.image }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image: [doom, arcade]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: examples/doom/${{ matrix.image }}
          platforms: linux/amd64,linux/arm64
          # Pull requests only build.
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/gcr-example-${{ matrix.image }}:latest
            ghcr.io/${{ github.repository_owner }}/gcr-example-${{ matrix.image }}:${{ github.sha }}
          # What links the package to this repository, and so lets
          # GITHUB_TOKEN push it (release.yml).
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
