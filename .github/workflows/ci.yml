name: CI

on:
  push:
    branches: [main]
  pull_request:

# One run per branch or PR at a time; a new push cancels the old run.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: sudo apt-get update && sudo apt-get install -y libseccomp-dev
      - run: go vet -tags seccomp ./...
      - run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go test -tags seccomp -race ./...
      - run: make build

  e2e:
    # Root, our CRIU fork; on x86 runners the kernel tracks dirty memory,
    # so migrations use pre-copy rounds. Each containerd release gcr
    # supports: 2.3 and later start the shim with the bootstrap protocol
    # and use the task API's version 3; the others the older way, and
    # version 2.
    name: e2e (containerd ${{ matrix.containerd }})
    strategy:
      fail-fast: false
      matrix:
        containerd: [2.4.2, 2.2.1, 2.0.7, 1.7.29]
        include:
          # Fails with runc as well: containerd 2.2 and this critest.
          - containerd: 2.2.1
            critest-skip: pod sandbox metrics
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: sudo CONTAINERD_VERSION=${{ matrix.containerd }} ./hack/ci-setup.sh
      - run: make build && sudo make install
      # Every lazy-pages daemon logs each page it handles, for a failed
      # lazy restore to show.
      - run: sudo systemctl set-environment GCR_LAZY_PAGES_DEBUG=1 && sudo systemctl restart containerd
      - name: end-to-end tests
        run: make test-e2e
      - name: CRI conformance (critest)
        env:
          SKIP: ${{ matrix.critest-skip }}
        run: cd /tmp && sudo critest --runtime-handler gcr --ginkgo.no-color --ginkgo.timeout 40m ${SKIP:+--ginkgo.skip "$SKIP"}
      - name: logs
        if: failure()
        # Warnings and errors from the whole run: the shim's come long
        # before the last lines. All of it as an artifact.
        run: |
          sudo journalctl -u containerd --no-pager -o short-precise > containerd.log
          grep -E 'level=(warning|error|fatal)' containerd.log | grep -v 'netlink policy off' | tail -1000
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: containerd-${{ matrix.containerd }}.log
          path: containerd.log
          retention-days: 7

  crio:
    # gcr as a CRI-O runtime of type "vm", next to containerd (whose CNI
    # config and CRIU it shares).
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: sudo ./hack/ci-setup.sh
      - run: make build && sudo make install
      - run: sudo ./hack/crio-setup.sh
      - name: end-to-end test under CRI-O
        run: make test-e2e E2E=./test/e2e/crio/
      - name: CRI conformance (critest) under CRI-O
        # Port forwarding is not implemented for CRI-O's "vm" runtimes;
        # host ports and pod metrics need setup this runner does not have
        # (they fail with crun too). Image identifiers are CRI-O's image
        # service alone, which disagrees with this critest on the runner.
        run: >-
          cd /tmp && sudo critest --runtime-endpoint unix:///run/crio/crio.sock
          --image-endpoint unix:///run/crio/crio.sock --runtime-handler gcr
          --ginkgo.no-color --ginkgo.timeout 30m
          --ginkgo.skip 'portforward|port mapping with host port|pod sandbox metrics|metrics descriptors|Image Identifier Consistency'
      - name: logs
        if: failure()
        run: sudo journalctl -u crio-gcr --no-pager | tail -300

  k8s:
    # Kubernetes (stock k0s 1.37 via k0da, in rootful podman) with gcr as a
    # RuntimeClass, added through a containerd drop-in and bind mounts.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # The runner's disk is nearly full of preinstalled SDKs; k0s, the node
      # image and its containerd images push it into kubelet's disk pressure
      # eviction, and pods stay unscheduled.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /
      - run: sudo apt-get update && sudo apt-get install -y libseccomp-dev
      - run: go install github.com/makhov/k0da@v0.4.0
      - run: make static
      - run: sudo env "PATH=$PATH:$(go env GOPATH)/bin" K0DA_RUNTIME=podman ./hack/e2e-k8s.sh
