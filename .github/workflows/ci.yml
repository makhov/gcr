name: CI

on:
  push:
    branches: [main]
  pull_request:

# One run per branch or PR at a time; a new push cancels the old run.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: sudo apt-get update && sudo apt-get install -y libseccomp-dev
      - run: go vet -tags seccomp ./...
      - run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go test -tags seccomp -race ./...
      - run: make build

  e2e:
    # Root, containerd 2.4, our CRIU fork; on x86 runners the kernel tracks
    # dirty memory, so migrations use pre-copy rounds.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: sudo ./hack/ci-setup.sh
      - run: make build && sudo make install
      - run: sudo systemctl restart containerd
      - name: end-to-end tests
        run: make test-e2e
      - name: CRI conformance (critest)
        run: cd /tmp && sudo critest --runtime-handler gcr --ginkgo.no-color --ginkgo.timeout 40m
      - name: logs
        if: failure()
        run: sudo journalctl -u containerd --no-pager | tail -300

  k8s:
    # Kubernetes (stock k0s 1.37 via k0da, in rootful podman) with gcr as a
    # RuntimeClass, added through a containerd drop-in and bind mounts.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # The runner's disk is nearly full of preinstalled SDKs; k0s, the node
      # image and its containerd images push it into kubelet's disk pressure
      # eviction, and pods stay unscheduled.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /
      - run: sudo apt-get update && sudo apt-get install -y libseccomp-dev
      - run: go install github.com/makhov/k0da@v0.4.0
      - run: make static
      - run: sudo env "PATH=$PATH:$(go env GOPATH)/bin" K0DA_RUNTIME=podman ./hack/e2e-k8s.sh
