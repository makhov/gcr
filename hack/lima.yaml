# Dev VM for gcr: Linux >= 6.12, containerd 2.4, CRIU, Go.
# Usage: limactl start --name=gcr hack/lima.yaml
base: template:ubuntu
cpus: 4
memory: 8GiB
disk: 40GiB
mounts:
  - location: "~/www/gcr"
    writable: true
  # Our CRIU fork (seccomp listener restore), built in the VM.
  - location: "~/www/criu"
    writable: true
  # Keep the template's read-only home mount from shadowing the repo.
  - location: "~"
    mountPoint: "/mnt/home"
containerd:
  system: false
  user: false
provision:
  - mode: system
    script: |
      #!/bin/bash
      set -eux -o pipefail
      export DEBIAN_FRONTEND=noninteractive
      ARCH=$(dpkg --print-architecture)
      CONTAINERD_VERSION=2.4.2
      GO_VERSION=1.27.0

      apt-get update
      apt-get install -y build-essential pkg-config libseccomp-dev criu jq \
        clang llvm libbpf-dev
      # The netlink policy (internal/netpolicy) is a BPF LSM program: add bpf
      # to the kernel's LSM list. Takes effect on the next boot:
      # `limactl restart gcr` once after the first start.
      echo 'GRUB_CMDLINE_LINUX_DEFAULT="$GRUB_CMDLINE_LINUX_DEFAULT lsm=lockdown,capability,landlock,yama,apparmor,bpf,ima,evm"' \
        >/etc/default/grub.d/90-gcr-bpf-lsm.cfg
      update-grub

      if ! command -v containerd >/dev/null; then
        curl -fsSL "https://github.com/containerd/containerd/releases/download/v${CONTAINERD_VERSION}/containerd-${CONTAINERD_VERSION}-linux-${ARCH}.tar.gz" \
          | tar -xz -C /usr/local
        curl -fsSL -o /etc/systemd/system/containerd.service \
          https://raw.githubusercontent.com/containerd/containerd/v${CONTAINERD_VERSION}/containerd.service
      fi

      if [ ! -x /usr/local/go/bin/go ]; then
        curl -fsSL "https://go.dev/dl/go${GO_VERSION}.linux-${ARCH}.tar.gz" | tar -xz -C /usr/local
      fi
      ln -sf /usr/local/go/bin/go /usr/local/bin/go

      CNI_VERSION=v1.9.1
      CRI_TOOLS_VERSION=v1.37.0
      if [ ! -x /opt/cni/bin/bridge ]; then
        mkdir -p /opt/cni/bin /etc/cni/net.d
        curl -fsSL "https://github.com/containernetworking/plugins/releases/download/${CNI_VERSION}/cni-plugins-linux-${ARCH}-${CNI_VERSION}.tgz" \
          | tar -xz -C /opt/cni/bin
        cat > /etc/cni/net.d/10-bridge.conflist <<'EOF'
      {"cniVersion": "1.0.0", "name": "bridge", "plugins": [
        {"type": "bridge", "bridge": "cni0", "isGateway": true, "ipMasq": true,
         "ipam": {"type": "host-local", "ranges": [[{"subnet": "10.88.0.0/16"}]], "routes": [{"dst": "0.0.0.0/0"}]}},
        {"type": "portmap", "capabilities": {"portMappings": true}},
        {"type": "loopback"}]}
      EOF
      fi
      for t in crictl critest; do
        command -v $t >/dev/null || curl -fsSL "https://github.com/kubernetes-sigs/cri-tools/releases/download/${CRI_TOOLS_VERSION}/$t-${CRI_TOOLS_VERSION}-linux-${ARCH}.tar.gz" \
          | tar -xz -C /usr/local/bin
      done
      printf 'runtime-endpoint: unix:///run/containerd/containerd.sock\nimage-endpoint: unix:///run/containerd/containerd.sock\n' > /etc/crictl.yaml

      mkdir -p /etc/containerd
      cat > /etc/containerd/config.toml <<'EOF'
      version = 3
      [plugins.'io.containerd.cri.v1.runtime'.containerd.runtimes.gcr]
        runtime_type = 'io.containerd.gcr.v2'
        pod_annotations = ['gcr.dev/*']
      EOF
      systemctl daemon-reload
      systemctl enable --now containerd
